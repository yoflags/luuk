<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (dark) document.documentElement.classList.add("dark");
  })();
</script>
<title>Pagina niet gevonden | Luuk Nijsen</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --fg: #3f3f46;
    --fg-strong: #18181b;
    --muted: #71717a;
    --border: #e4e4e7;
    --surface: #fafafa;
    --surface-hover: #f4f4f5;
    --primary: #6366f1;
    --primary-soft: rgba(99, 102, 241, 0.1);
    --btn-bg: #18181b;
    --btn-fg: #ffffff;
    --btn-hover: #27272a;
    --grid: rgba(24, 24, 27, 0.14);
  }
  html.dark {
    --bg: #18181b;
    --fg: #e4e4e7;
    --fg-strong: #ffffff;
    --muted: #a1a1aa;
    --border: #27272a;
    --surface: #27272a;
    --surface-hover: #2f2f33;
    --primary: #818cf8;
    --primary-soft: rgba(129, 140, 248, 0.1);
    --btn-bg: #ffffff;
    --btn-fg: #18181b;
    --btn-hover: #f4f4f5;
    --grid: rgba(255, 255, 255, 0.16);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex; flex-direction: column;
    position: relative; overflow-x: hidden;
  }
  body::before {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 78px 78px;
    background-position: center top;
    -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 0%, #000 0%, transparent 100%);
            mask-image: radial-gradient(ellipse 70% 70% at 50% 0%, #000 0%, transparent 100%);
  }
  a { color: inherit; text-decoration: none; }
  main {
    position: relative; z-index: 1; flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 96px 16px;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 500; padding: 4px 12px; border-radius: 999px;
    color: var(--primary); background: var(--primary-soft);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 25%, transparent);
    margin-bottom: 32px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  h1 {
    font-size: clamp(40px, 8vw, 72px); line-height: 1.08;
    font-weight: 700; letter-spacing: -0.025em; color: var(--fg-strong);
  }
  .lead { margin-top: 24px; max-width: 36rem; font-size: 18px; }
  .path {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px;
    color: var(--fg-strong); background: var(--surface); padding: 2px 6px; border-radius: 6px;
    box-shadow: inset 0 0 0 1px var(--border); word-break: break-all;
  }
  .actions { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 6px; font-size: 16px; font-weight: 500;
    transition: background .15s; box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  .btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .btn-primary { background: var(--btn-bg); color: var(--btn-fg); }
  .btn-primary:hover { background: var(--btn-hover); }
  .btn-secondary { background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1px var(--border), 0 1px 2px rgba(0,0,0,.05); }
  .btn-secondary:hover { background: var(--surface-hover); }
  footer { position: relative; z-index: 1; border-top: 1px solid var(--border); padding: 24px 16px; text-align: center; }
  footer small { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>

<main>
  <span class="pill">404</span>
  <h1>Pagina niet gevonden</h1>
  <p class="lead">De pagina <span class="path" id="path">die je zoekt</span> bestaat niet (meer). Misschien is de link verouderd of zit er een typfout in.</p>
  <div class="actions">
    <a class="btn btn-primary" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      Terug naar de startpagina
    </a>
    <a class="btn btn-secondary" href="https://status.luuknijsen.com">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
      Bekijk status
    </a>
  </div>
</main>

<footer>
  <small>&copy; <span id="year">2026</span> Luuk Nijsen</small>
</footer>

<script>
  (function () {
    var p = window.location.pathname;
    if (p && p !== "/" && p !== "/404.html") document.getElementById("path").textContent = p;
    document.getElementById("year").textContent = new Date().getFullYear();
  })();
</script>
</body>
</html>
